name: Deploy Backend [develop]

on:
  push:
    branches:
      - develop
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend-develop.yml"

jobs:
  deploy:
    runs-on: [self-hosted, rn-gerenciadora]

    steps:
      - name: Baixando código do repositório
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: 🚀 Deploy do Backend [develop] via Docker
        run: |
          set -e

          echo "🚀 Iniciando deploy do backend [develop]..."

          DEPLOY_DIR="/opt/rn-gerenciadora/backend-dev"

          echo "📁 Preparando diretório de deploy..."
          mkdir -p "${DEPLOY_DIR}"

          echo "📤 Sincronizando código..."
          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.git' \
            ./ "${DEPLOY_DIR}/"

          cd "${DEPLOY_DIR}"

          echo "🐳 Buildando e subindo containers (Docker Compose)..."
          docker compose build
          docker compose up -d

          sleep 5

          echo "📊 Status dos containers:"
          docker compose ps

          echo ""
          echo "✅ Deploy do Backend [develop] concluído!"
          echo "🕐 Horário: $(date '+%Y-%m-%d %H:%M:%S')"
